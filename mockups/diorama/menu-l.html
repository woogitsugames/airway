@font-face{font-family:'Over';src:url('../fonts/Overpass-400.ttf');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Atk';src:url('../fonts/AtkinsonHyperlegibleNext-400.ttf');font-weight:400;font-style:normal;font-display:block}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:915px;height:412px;overflow:hidden}
body{position:relative;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

body{font-family:Atk,sans-serif;color:#2A2420;background:linear-gradient(#8CC3D8,#BFE0EA)}
canvas.world{position:absolute;inset:0;width:100%;height:100%}
.hd{font-family:Over,sans-serif;font-weight:800}
.lab{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#7A6F62;font-weight:700}
.val{font-family:Over;font-weight:800;font-size:21px;line-height:1}
/* boarding pass: notched where main part meets the stub */
.pass{position:absolute;display:flex;height:60px;background:#FBF8F1;
  -webkit-mask:radial-gradient(circle 7px at var(--cut) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 7px at var(--cut) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.pass .band{width:8px;background:#1E6F6A}
.pass .cell{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 10px}
.pass .perf{border-left:2px dashed #D8CFBF;margin:9px 0}
/* luggage tag: die-cut corners + eyelet */
.tagx{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;background:#D6B88A;color:#2A2420;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%,0 14px);font-family:Over;font-weight:800;font-size:21px}
.tagx:before{content:'';position:absolute;top:6px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#8CC3D8;box-shadow:0 0 0 2px #B8955F}
.tagx.on{background:#FBF8F1}
.cord{position:absolute;height:2px;background:#2A2420;opacity:.7}
.dock{position:absolute;display:flex;gap:8px}
.dock .tagx{width:64px;height:62px;padding-top:12px}
.dock.v{flex-direction:column}.dock.v .tagx{width:72px;height:58px}
.string{position:absolute;width:1.5px;background:#2A2420;opacity:.7}
/* passenger bubble = small white luggage tag on a string from the airport */
.bubble{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:2px;padding:4px 7px 4px 16px;background:#FBF8F1;color:#2A2420;
  clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.bubble:before{content:'';position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#2A2420;opacity:.5}
.bubble.jam{background:#C8352A;color:#FBF8F1}
.bubble .t{font-family:Over;font-weight:800;font-size:13px;margin-left:3px}
/* air-cargo label: kraft, stencil header, field grid, zigzag tear at the bottom */
.cargo{position:absolute;background:#D6B88A;color:#2A2420;display:flex;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),96% 100%,92% calc(100% - 8px),88% 100%,84% calc(100% - 8px),80% 100%,76% calc(100% - 8px),72% 100%,68% calc(100% - 8px),64% 100%,60% calc(100% - 8px),56% 100%,52% calc(100% - 8px),48% 100%,44% calc(100% - 8px),40% 100%,36% calc(100% - 8px),32% 100%,28% calc(100% - 8px),24% 100%,20% calc(100% - 8px),16% 100%,12% calc(100% - 8px),8% 100%,4% calc(100% - 8px),0 100%)}
.cargo .win{flex:none;background:#EADCC2;border:2px solid #2A2420;margin:10px}
.cargo .head{font-family:Mono;font-weight:700;font-size:11px;letter-spacing:.16em;border-bottom:2px solid #2A2420;padding-bottom:4px;display:flex;justify-content:space-between}
.cargo .grid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin-top:6px}
.cargo .grid span:nth-child(odd){font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding-top:3px;color:#5E4E3A}
.cargo .stamp{display:inline-block;margin-top:8px;border:2px solid #C8352A;color:#C8352A;font-family:Mono;font-weight:700;font-size:11px;letter-spacing:.1em;padding:2px 6px;transform:rotate(-3deg)}
/* split-flap departure board */
.board{position:absolute;background:#1C1E20;padding:10px 10px 12px}
.board .bh{display:flex;font-family:Mono;font-weight:700;font-size:10px;letter-spacing:.16em;color:#8B8F93;padding:0 2px 8px}
.row{display:flex;align-items:center;gap:8px;height:58px;border-top:1px solid #000}
.row .st{margin-left:auto;font-family:Mono;font-weight:700;font-size:11px;letter-spacing:.08em}
.fl{display:inline-flex;gap:2px}.fl i{font-style:normal;display:inline-block;width:14px;height:24px;line-height:24px;text-align:center;font-family:Mono;font-weight:700;font-size:15px;color:#F2EFE6;
  background:linear-gradient(#2C2F32 0 49%,#000 49% 52%,#25282B 52%)}
.fl.y i{color:#FFC72C}
.sub{font-size:11.5px;color:#9A9EA2;margin-top:3px}
/* yellow-on-black airport wayfinding sign with the game title */
.sign{position:absolute;display:flex;align-items:center;gap:14px;background:#FFC72C;color:#1C1E20;padding:10px 18px 10px 12px}
.sign .pict{background:#1C1E20;display:flex;align-items:center;justify-content:center}
/* ATC flight progress strip */
.strip{position:absolute;display:flex;white-space:nowrap;background:#F4EBC9;font-size:12px;line-height:1.3;border-left:10px solid #C8352A}
.strip .f{padding:6px 9px;border-right:1px solid #CDBF8F}.strip .f:last-child{border:0}
.strip b{font-family:Over;font-weight:800;font-size:15px;color:#C8352A}
