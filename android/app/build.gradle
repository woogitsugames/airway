apply plugin: 'com.android.application'

// [task-24] Never store an upload keystore or credentials in this repository.
def awKeystore = System.getenv('AW_KEYSTORE')
def awKeystorePass = System.getenv('AW_KEYSTORE_PASS')
def awKeyAlias = System.getenv('AW_KEY_ALIAS') ?: 'upload'
def awKeyPass = System.getenv('AW_KEY_PASS') ?: awKeystorePass
def awRepoRoot = rootProject.projectDir.parentFile.canonicalFile
def awKeyFile = awKeystore ? new File(awKeystore).canonicalFile : null
def awInsideRepository = awKeyFile && (awKeyFile == awRepoRoot || awKeyFile.path.startsWith(awRepoRoot.path + File.separator))
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }
if (releaseRequested && (!awKeyFile || !awKeyFile.isAbsolute() || !awKeyFile.isFile() || !awKeystorePass || !awKeyAlias || !awKeyPass || awInsideRepository)) {
    throw new GradleException('Signed release requires external absolute AW_KEYSTORE, AW_KEYSTORE_PASS and optional AW_KEY_ALIAS/AW_KEY_PASS')
}

android {
    namespace = 'pl.samsufi.airway'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId = 'pl.samsufi.airway'
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (awKeyFile && awKeystorePass && awKeyFile.isAbsolute() && awKeyFile.isFile() && !awInsideRepository) {
                storeFile = awKeyFile
                storePassword = awKeystorePass
                keyAlias = awKeyAlias
                keyPassword = awKeyPass
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Generated plugin Gradle dependencies are kept separate from the app's build settings.
apply from: 'capacitor.build.gradle'
